<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fichas de Estudio</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Scripts esenciales -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCS0dN_QSwgwdJXPO-o6zH69UebpZNnlfE",
      authDomain: "fichas-estudio.firebaseapp.com",
      projectId: "fichas-estudio",
      storageBucket: "fichas-estudio.firebasestorage.app",
      messagingSenderId: "149168785858",
      appId: "1:149168785858:web:c050886e81d9bda6d6ee5b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.firebaseDB = { db, collection, onSnapshot, doc, setDoc, deleteDoc };
    window.dispatchEvent(new CustomEvent('firebase-loaded'));
  </script>
</head>
<body class="h-full font-sans text-slate-100 antialiased select-none bg-slate-900 flex justify-center" x-data="appData()" x-init="initApp()">

  <!-- MODAL DE BLOQUEO POR CÓDIGO DE ACCESO -->
  <div x-show="!isAuthorized" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl space-y-4">
      <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl mx-auto flex items-center justify-center mb-2">
        <i data-lucide="lock" class="w-8 h-8"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-100">Acceso Protegido</h2>
      <p class="text-xs text-slate-400">Ingresa el código secreto para entrar a las fichas.</p>
      
      <form @submit.prevent="checkAccess()" class="space-y-3">
        <input type="password" x-model="inputCode" placeholder="Código de acceso" 
               class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg text-slate-100 tracking-widest focus:outline-none focus:border-indigo-500">
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white shadow-lg transition">
          Ingresar
        </button>
      </form>
      <p x-show="authError" class="text-xs text-rose-400 font-medium">Código incorrecto. Intenta de nuevo.</p>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div class="w-full max-w-md h-full flex flex-col bg-slate-900 shadow-2xl relative overflow-hidden border-x border-slate-800">
    
    <!-- Header -->
    <header class="bg-slate-800 px-4 py-3 flex items-center justify-between border-b border-slate-700/60 sticky top-0 z-20">
      <div class="flex items-center space-x-2">
        <template x-if="currentTab !== 'home'">
          <button @click="currentTab = 'home'; activeQuiz = null;" class="p-1 rounded-full hover:bg-slate-700 text-slate-300">
            <i data-lucide="arrow-left" class="w-6 h-6"></i>
          </button>
        </template>
        <div class="flex items-center space-x-2">
          <i data-lucide="layers" class="w-6 h-6 text-indigo-400"></i>
          <h1 class="text-xl font-bold text-slate-100 truncate max-w-[160px]" 
              x-text="currentTab === 'study' ? activeDeck?.title : (currentTab === 'quiz' ? 'Examen / Práctica' : 'Fichas de Estudio')"></h1>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <template x-if="currentTab === 'study'">
          <div class="flex items-center space-x-1">
            <button @click="startQuiz()" title="Modo Examen / Práctica" class="p-2 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-400 rounded-full shadow-lg">
              <i data-lucide="help-circle" class="w-5 h-5"></i>
            </button>
            <button @click="shuffleCards()" title="Mezclar fichas manualmente" class="p-2 bg-slate-700 hover:bg-slate-600 text-indigo-400 rounded-full shadow-lg">
              <i data-lucide="shuffle" class="w-5 h-5"></i>
            </button>
          </div>
        </template>

        <template x-if="currentTab === 'home'">
          <button @click="openCreateDeckModal()" class="p-2 bg-indigo-600 hover:bg-indigo-500 rounded-full text-white shadow-lg">
            <i data-lucide="folder-plus" class="w-5 h-5"></i>
          </button>
        </template>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto no-scrollbar p-4 relative flex flex-col">

      <!-- Home Tab -->
      <div x-show="currentTab === 'home'" class="space-y-4 flex-1">
        <div class="relative">
          <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3 text-slate-400"></i>
          <input type="text" x-model="searchQuery" placeholder="Buscar mazos..." 
                 class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500">
        </div>

        <div class="space-y-3">
          <template x-for="deck in filteredDecks" :key="deck.id">
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex justify-between items-center hover:border-indigo-500/50 transition">
              <div class="flex-1 pr-3 cursor-pointer" @click="startStudy(deck)">
                <h3 class="font-bold text-lg text-slate-100" x-text="deck.title"></h3>
                <p class="text-xs text-slate-400 mt-0.5" x-text="(deck.cards ? deck.cards.length : 0) + ' tarjetas'"></p>
              </div>

              <div class="flex items-center space-x-2">
                <button @click="openEditDeckModal(deck)" class="p-2 text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-slate-700/50" title="Editar mazo">
                  <i data-lucide="edit-3" class="w-5 h-5"></i>
                </button>
                <button @click="deleteDeck(deck.id)" class="p-2 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-700/50" title="Eliminar mazo">
                  <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
                <button @click="startStudy(deck)" class="p-2 bg-indigo-600/30 text-indigo-400 hover:bg-indigo-600/50 rounded-xl" title="Estudiar">
                  <i data-lucide="play" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
          </template>

          <template x-if="filteredDecks.length === 0">
            <div class="text-center py-12 text-slate-500">
              <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
              <p class="text-base font-medium">No se encontraron mazos</p>
              <p class="text-xs mt-1">Crea un mazo con el botón +</p>
            </div>
          </template>
        </div>
      </div>

      <!-- Study Tab -->
      <div x-show="currentTab === 'study'" class="flex-1 flex flex-col justify-between items-center py-2">
        <template x-if="activeDeck && activeDeck.cards && activeDeck.cards.length > 0">
          <div class="w-full flex-1 flex flex-col justify-between items-center space-y-4">
            
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
              <div class="bg-indigo-500 h-full transition-all duration-300"
                   :style="'width: ' + ((currentCardIndex + 1) / activeDeck.cards.length * 100) + '%'"></div>
            </div>

            <div class="text-xs text-slate-400 font-semibold tracking-wider">
              TARJETA <span x-text="currentCardIndex + 1"></span> DE <span x-text="activeDeck.cards.length"></span>
            </div>

            <!-- Card 3D Flip -->
            <div class="w-full flex-1 max-h-[420px] perspective-1000 cursor-pointer my-auto" @click="isFlipped = !isFlipped">
              <div class="relative w-full h-full duration-500 transform-style-3d transition-transform rounded-3xl shadow-xl"
                   :class="{ 'rotate-y-180': isFlipped }">
                
                <!-- Front (Solo Término/Palabra) -->
                <div class="absolute w-full h-full backface-hidden bg-gradient-to-br from-slate-800 to-slate-800/90 border-2 border-indigo-500/30 rounded-3xl p-5 flex flex-col justify-between items-center text-center overflow-y-auto no-scrollbar">
                  <div class="w-full text-right text-xs text-indigo-400 flex justify-end items-center space-x-1">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                    <span>Toca para girar</span>
                  </div>
                  <div class="my-auto space-y-3 w-full">
                    <h2 class="text-3xl font-extrabold text-slate-100 tracking-wide" x-text="currentCard ? currentCard.term : ''"></h2>
                  </div>
                  <div class="text-xs text-slate-500">Palabra / Término</div>
                </div>

                <!-- Back (Definición + Imagen opcional) -->
                <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-900/40 to-slate-800 border-2 border-emerald-500/30 rounded-3xl p-5 flex flex-col justify-between items-center text-center overflow-y-auto no-scrollbar">
                  <div class="w-full text-right text-xs text-emerald-400 flex justify-end items-center space-x-1">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                    <span>Toca para girar</span>
                  </div>
                  <div class="my-auto overflow-y-auto max-h-[250px] px-2 no-scrollbar w-full space-y-3">
                    <template x-if="currentCard && currentCard.imageUrl">
                      <img :src="currentCard.imageUrl" class="max-h-36 mx-auto rounded-xl object-contain border border-slate-700/60 shadow-md">
                    </template>
                    <p class="text-lg font-medium text-slate-200 leading-relaxed" x-text="currentCard ? currentCard.definition : ''"></p>
                  </div>
                  <div class="text-xs text-slate-500">Significado / Respuesta</div>
                </div>

              </div>
            </div>

            <!-- Controls -->
            <div class="w-full grid grid-cols-2 gap-3 pt-2">
              <button @click="prevCard()" :disabled="currentCardIndex === 0"
                      class="flex items-center justify-center space-x-2 py-3 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none rounded-2xl font-semibold text-slate-200 border border-slate-700">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
                <span>Anterior</span>
              </button>

              <button @click="nextCard()"
                      class="flex items-center justify-center space-x-2 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-semibold text-white shadow-lg">
                <span x-text="currentCardIndex === activeDeck.cards.length - 1 ? 'Iniciar Examen' : 'Siguiente'"></span>
                <i :data-lucide="currentCardIndex === activeDeck.cards.length - 1 ? 'help-circle' : 'chevron-right'" class="w-5 h-5"></i>
              </button>
            </div>

          </div>
        </template>
      </div>

      <!-- Quiz Tab -->
      <div x-show="currentTab === 'quiz'" class="flex-1 flex flex-col justify-between py-2 space-y-4">
        <template x-if="quizFinished">
          <div class="text-center my-auto space-y-4 bg-slate-800/60 border border-slate-700 p-6 rounded-3xl">
            <div class="w-16 h-16 bg-emerald-600/20 text-emerald-400 rounded-full mx-auto flex items-center justify-center">
              <i data-lucide="award" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-100">¡Práctica Terminada!</h2>
            <p class="text-sm text-slate-300">Has completado todas las preguntas del mazo.</p>
            
            <!-- Calificación obtenida -->
            <div class="bg-slate-900/80 border border-slate-700 rounded-2xl p-4">
              <p class="text-xs text-slate-400 uppercase tracking-widest font-bold">Tu Calificación Final</p>
              <p class="text-3xl font-extrabold text-indigo-400 mt-1" x-text="quizScore + ' / ' + quizQuestions.length"></p>
            </div>

            <button @click="startQuiz()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-2xl text-white shadow-lg">
              Repetir Práctica
            </button>
            
            <!-- Botón Aceptar para volver al inicio -->
            <button @click="currentTab = 'home'; activeDeck = null;" class="w-full py-3 bg-slate-800 hover:bg-slate-700 font-semibold rounded-2xl text-slate-300 border border-slate-700">
              Aceptar
            </button>
          </div>
        </template>

        <template x-if="!quizFinished && currentQuizQuestion">
          <div class="flex-1 flex flex-col justify-between space-y-4">
            
            <div class="flex justify-between items-center text-xs text-slate-400 font-semibold">
              <span>PREGUNTA <span x-text="quizIndex + 1"></span> DE <span x-text="activeDeck.cards.length"></span></span>
              <span class="text-indigo-400" x-text="currentQuizQuestion.type === 'choice' ? 'Opción Múltiple' : 'Escribir Significado'"></span>
            </div>

            <!-- Pregunta -->
            <div class="bg-slate-800/80 border border-slate-700 rounded-3xl p-5 text-center space-y-3">
              <span class="text-xs uppercase tracking-widest text-slate-500 font-bold">¿Qué significa o cuál es el término para?:</span>
              <h2 class="text-2xl font-extrabold text-slate-100" x-text="currentQuizQuestion.prompt"></h2>
            </div>

            <!-- Opción Múltiple -->
            <template x-if="currentQuizQuestion.type === 'choice'">
              <div class="space-y-2.5">
                <template x-for="(option, idx) in currentQuizQuestion.options" :key="idx">
                  <button @click="answerChoice(option)" 
                          class="w-full p-4 rounded-2xl text-left font-medium border text-sm transition flex justify-between items-center"
                          :class="{
                            'bg-slate-800 border-slate-700 hover:border-indigo-500 text-slate-200': quizSelectedOption === null,
                            'bg-emerald-600/30 border-emerald-500 text-emerald-200': quizSelectedOption !== null && option === currentQuizQuestion.correct,
                            'bg-rose-600/30 border-rose-500 text-rose-200': quizSelectedOption !== null && quizSelectedOption === option && option !== currentQuizQuestion.correct,
                            'bg-slate-800/40 border-slate-800 text-slate-500': quizSelectedOption !== null && option !== currentQuizQuestion.correct
                          }"
                          :disabled="quizSelectedOption !== null">
                    <span x-text="option"></span>
                    <template x-if="quizSelectedOption !== null && option === currentQuizQuestion.correct">
                      <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
                    </template>
                  </button>
                </template>
              </div>
            </template>

            <!-- Escribir la respuesta -->
            <template x-if="currentQuizQuestion.type === 'write'">
              <div class="space-y-3">
                <input type="text" x-model="quizInputAnswer" placeholder="Escribe tu respuesta aquí..." 
                       class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500"
                       :disabled="quizAnswered">
                
                <template x-if="!quizAnswered">
                  <button @click="submitWrittenAnswer()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-2xl text-white shadow-lg">
                    Comprobar Respuesta
                  </button>
                </template>

                <template x-if="quizAnswered">
                  <div class="space-y-3 text-center p-4 rounded-2xl border" :class="quizIsCorrect ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-200' : 'bg-rose-950/40 border-rose-500/50 text-rose-200'">
                    <p class="font-bold text-sm" x-text="quizIsCorrect ? '¡Correcto! Muy bien.' : 'Incorrecto. La respuesta era: ' + currentQuizQuestion.correct"></p>
                    <button @click="nextQuizQuestion()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 font-semibold rounded-xl text-slate-100">
                      Siguiente Pregunta
                    </button>
                  </div>
                </template>
              </div>
            </template>

          </div>
        </template>
      </div>

    </main>

    <!-- Modal Editar / Crear Mazo -->
    <div x-show="showDeckModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-30 flex items-center justify-center p-4">
      <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-3xl p-5 flex flex-col max-h-[85vh] shadow-2xl">
        <div class="flex justify-between items-center mb-4 border-b border-slate-700/60 pb-3">
          <h2 class="text-lg font-bold text-slate-100" x-text="editingDeckId ? 'Editar Mazo' : 'Nuevo Mazo'"></h2>
          <button @click="showDeckModal = false" class="p-1 rounded-full text-slate-400 hover:bg-slate-700">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="overflow-y-auto no-scrollbar space-y-4 flex-1 pr-1">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre del Mazo</label>
            <input type="text" x-model="deckForm.title" placeholder="Ej. Vocabulario Inglés" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>

          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <label class="text-xs font-semibold text-slate-400">Tarjetas / Fichas</label>
              <button @click="addCardToForm()" class="text-xs text-indigo-400 font-semibold flex items-center space-x-1 hover:underline">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Añadir Tarjeta al inicio</span>
              </button>
            </div>

            <template x-for="(card, index) in deckForm.cards" :key="index">
              <div class="bg-slate-900/80 border border-slate-700/70 p-3.5 rounded-2xl relative space-y-2.5">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-semibold text-indigo-400" x-text="'#' + (index + 1)"></span>
                  <button @click="removeCardFromForm(index)" class="text-slate-500 hover:text-rose-400 p-1">
                    <i data-lucide="trash" class="w-4 h-4"></i>
                  </button>
                </div>
                <input type="text" x-model="card.term" placeholder="Palabra / Frente" 
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                
                <input type="text" x-model="card.imageUrl" placeholder="URL de imagen (opcional https://...)" 
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">

                <textarea x-model="card.definition" placeholder="Significado / Reverso" rows="2"
                          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
              </div>
            </template>
          </div>
        </div>

        <div class="pt-4 border-t border-slate-700/60 mt-2">
          <button @click="saveDeck()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-2xl text-white shadow-lg">
            Guardar Mazo
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SECRET_CODE = "1010";    // Código para entrar a la app
    const DELETE_CODE = "5910";    // CÓDIGO EXCLUSIVO PARA BORRAR

    function appData() {
      return {
        isAuthorized: false,
        inputCode: '',
        authError: false,
        currentTab: 'home',
        searchQuery: '',
        showDeckModal: false,
        editingDeckId: null,
        deckForm: { title: '', cards: [] },
        activeDeck: null,
        currentCardIndex: 0,
        isFlipped: false,
        
        quizQuestions: [],
        quizIndex: 0,
        currentQuizQuestion: null,
        quizFinished: false,
        quizSelectedOption: null,
        quizInputAnswer: '',
        quizAnswered: false,
        quizIsCorrect: false,
        quizScore: 0, // NUEVO: Contador de aciertos

        decks: [],

        initApp() {
          if (localStorage.getItem('android_flashcards_auth') === 'true') {
            this.isAuthorized = true;
          }

          window.addEventListener('firebase-loaded', () => {
            const { db, collection, onSnapshot } = window.firebaseDB;
            onSnapshot(collection(db, 'decks'), (snapshot) => {
              let cloudDecks = [];
              snapshot.forEach((docSnap) => {
                cloudDecks.push({ id: docSnap.id, ...docSnap.data() });
              });
              this.decks = cloudDecks;
              this.refreshIcons();
            });
          });

          this.refreshIcons();
        },
        checkAccess() {
          if (this.inputCode.trim() === SECRET_CODE) {
            this.isAuthorized = true;
            localStorage.setItem('android_flashcards_auth', 'true');
            this.authError = false;
            this.refreshIcons();
          } else {
            this.authError = true;
            this.inputCode = '';
          }
        },
        refreshIcons() {
          setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 150);
        },
        async saveDeckToFirebase(deck) {
          if (window.firebaseDB) {
            const { db, doc, setDoc } = window.firebaseDB;
            await setDoc(doc(db, 'decks', String(deck.id)), deck);
          }
        },
        async deleteDeckFromFirebase(id) {
          if (window.firebaseDB) {
            const { db, doc, deleteDoc } = window.firebaseDB;
            await deleteDoc(doc(db, 'decks', String(id)));
          }
        },
        get filteredDecks() {
          if (!this.searchQuery) return this.decks;
          return this.decks.filter(d => d.title.toLowerCase().includes(this.searchQuery.toLowerCase()));
        },
        openCreateDeckModal() {
          this.editingDeckId = null;
          this.deckForm = { title: '', cards: [{ term: '', definition: '', imageUrl: '' }] };
          this.showDeckModal = true;
          this.refreshIcons();
        },
        openEditDeckModal(deck) {
          this.editingDeckId = deck.id;
          this.deckForm = JSON.parse(JSON.stringify(deck));
          this.showDeckModal = true;
          this.refreshIcons();
        },
        addCardToForm() {
          this.deckForm.cards.unshift({ term: '', definition: '', imageUrl: '' });
          this.refreshIcons();
        },
        removeCardFromForm(index) {
          this.deckForm.cards.splice(index, 1);
        },
        async saveDeck() {
          if (!this.deckForm.title.trim()) return alert('Ingresa un título para el mazo');
          const deckId = this.editingDeckId ? this.editingDeckId : Date.now();
          const deckToSave = { ...this.deckForm, id: deckId };
          
          await this.saveDeckToFirebase(deckToSave);
          this.showDeckModal = false;
          this.refreshIcons();
        },
        async deleteDeck(id) {
          const codeInput = prompt('🔒 Ingresa el código secreto de administrador para eliminar este mazo:');
          
          if (codeInput === null) return;

          if (codeInput.trim() === DELETE_CODE) {
            await this.deleteDeckFromFirebase(id);
            this.decks = this.decks.filter(d => String(d.id) !== String(id));
            localStorage.removeItem('android_flashcards_decks');
            alert('✅ Mazo eliminado correctamente.');
            this.refreshIcons();
          } else {
            alert('❌ Código incorrecto. No tienes permisos para eliminar mazos.');
          }
        },
        startStudy(deck) {
          let deckCopy = JSON.parse(JSON.stringify(deck));
          
          if (deckCopy.cards && deckCopy.cards.length > 1) {
            let cards = deckCopy.cards;
            for (let i = cards.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [cards[i], cards[j]] = [cards[j], cards[i]];
            }
          }

          this.activeDeck = deckCopy;
          this.currentCardIndex = 0;
          this.isFlipped = false;
          this.currentTab = 'study';
          this.refreshIcons();
        },
        shuffleCards() {
          if (!this.activeDeck || !this.activeDeck.cards || this.activeDeck.cards.length <= 1) return;
          this.isFlipped = false;
          setTimeout(() => {
            let cards = [...this.activeDeck.cards];
            for (let i = cards.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            this.activeDeck.cards = cards;
            this.currentCardIndex = 0;
          }, 150);
        },
        get currentCard() {
          if (!this.activeDeck || !this.activeDeck.cards) return null;
          return this.activeDeck.cards[this.currentCardIndex] || null;
        },
        nextCard() {
          if (this.activeDeck) {
            if (this.currentCardIndex < this.activeDeck.cards.length - 1) {
              this.isFlipped = false;
              setTimeout(() => { this.currentCardIndex++; }, 150);
            } else {
              this.startQuiz();
            }
          }
        },
        prevCard() {
          if (this.currentCardIndex > 0) {
            this.isFlipped = false;
            setTimeout(() => { this.currentCardIndex--; }, 150);
          }
        },
        startQuiz() {
          if (!this.activeDeck || !this.activeDeck.cards || this.activeDeck.cards.length === 0) return;
          this.currentTab = 'quiz';
          this.quizFinished = false;
          this.quizIndex = 0;
          this.quizScore = 0; // Reiniciar calificación al iniciar

          let cards = [...this.activeDeck.cards];
          cards.sort(() => Math.random() - 0.5);

          this.quizQuestions = cards.map((card, idx) => {
            const isChoice = idx % 2 === 0 || cards.length < 3;
            if (isChoice) {
              let others = this.activeDeck.cards.filter(c => c.definition !== card.definition).map(c => c.definition);
              others.sort(() => Math.random() - 0.5);
              let options = others.slice(0, 3);
              options.push(card.definition);
              options.sort(() => Math.random() - 0.5);

              return {
                type: 'choice',
                prompt: card.term,
                correct: card.definition,
                options: options
              };
            } else {
              return {
                type: 'write',
                prompt: card.term,
                correct: card.definition
              };
            }
          });

          this.loadQuizQuestion();
          this.refreshIcons();
        },
        loadQuizQuestion() {
          if (this.quizIndex < this.quizQuestions.length) {
            this.currentQuizQuestion = this.quizQuestions[this.quizIndex];
            this.quizSelectedOption = null;
            this.quizInputAnswer = '';
            this.quizAnswered = false;
            this.quizIsCorrect = false;
          } else {
            this.quizFinished = true;
          }
          this.refreshIcons();
        },
        answerChoice(option) {
          this.quizSelectedOption = option;
          if (option === this.currentQuizQuestion.correct) {
            this.quizScore++; // Sumar punto si es correcta
          }
          setTimeout(() => {
            this.quizIndex++;
            this.loadQuizQuestion();
          }, 1200);
        },
        submitWrittenAnswer() {
          if (!this.quizInputAnswer.trim()) return;
          this.quizAnswered = true;
          const userAns = this.quizInputAnswer.trim().toLowerCase();
          const correctAns = this.currentQuizQuestion.correct.trim().toLowerCase();
          this.quizIsCorrect = (userAns === correctAns);
          if (this.quizIsCorrect) {
            this.quizScore++; // Sumar punto si está bien escrita
          }
        },
        nextQuizQuestion() {
          this.quizIndex++;
          this.loadQuizQuestion();
        }
      }
    }
  </script>
